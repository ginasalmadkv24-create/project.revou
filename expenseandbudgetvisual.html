<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="header-top">
      <h1>💰 Expense & Budget Visualizer</h1>
      <button class="theme-toggle" id="theme-toggle">🌙 Dark</button>
    </div>
  </header>

  <main class="container">

    <!-- ===== Total Balance ===== -->
    <div class="card balance-card">
      <div class="balance-label">Total Pengeluaran</div>
      <div class="balance-amount" id="total-balance">Rp 0</div>
      <div class="balance-sub" id="tx-count">0 transaksi</div>

      <!-- Spending Limit Warning Banner -->
      <div class="limit-banner" id="limit-banner">
        <span id="limit-banner-msg"></span>
      </div>
    </div>

    <!-- ===== Monthly Summary ===== -->
    <div class="card">
      <div class="form-title">📅 Ringkasan Bulan Ini</div>
      <div class="summary-grid" id="monthly-summary"></div>
    </div>

    <!-- ===== Add Transaction Form ===== -->
    <div class="card">
      <div class="form-title">➕ Tambah Transaksi</div>
      <form id="transaction-form" novalidate>

        <div class="form-group">
          <label for="item-name">Nama Item</label>
          <input type="text" id="item-name" placeholder="cth: Makan siang, Grab, dll" autocomplete="off" />
          <div class="error-msg" id="name-error">Nama item tidak boleh kosong.</div>
        </div>

        <div class="form-group">
          <label for="item-amount">Jumlah (Rp)</label>
          <input type="number" id="item-amount" placeholder="cth: 25000" min="1" />
          <div class="error-msg" id="amount-error">Masukkan jumlah yang valid (lebih dari 0).</div>
        </div>

        <div class="form-group">
          <label for="item-category">Kategori</label>
          <select id="item-category">
            <option value="">-- Pilih Kategori --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
            <option value="custom">+ Tambah Kategori Baru</option>
          </select>
          <div class="error-msg" id="cat-error">Pilih kategori terlebih dahulu.</div>

          <!-- Custom Category Input -->
          <div class="custom-category-row" id="custom-category-row">
            <input type="text" id="custom-cat-input" placeholder="Nama kategori baru..." />
            <button type="button" class="btn-add-cat" id="btn-add-cat">Tambah</button>
          </div>
        </div>

        <!-- Spending Limit -->
        <div class="form-group">
          <label for="limit-input">Batas Pengeluaran (Rp) — opsional</label>
          <div class="limit-row">
            <div class="form-group">
              <input type="number" id="limit-input" placeholder="cth: 500000" min="1" />
            </div>
            <button type="button" class="btn-set-limit" id="btn-set-limit">Set Limit</button>
          </div>
        </div>

        <button type="submit" class="btn-add">Tambah Transaksi</button>
      </form>
    </div>

    <!-- ===== Transaction List + Chart ===== -->
    <div class="bottom-grid">

      <!-- Transaction List -->
      <div class="card">
        <div class="list-header">
          <div class="list-title">📋 Transaksi</div>
          <div class="sort-controls">
            <select id="sort-select" title="Urutkan">
              <option value="newest">Terbaru</option>
              <option value="amount-desc">Jumlah ↑</option>
              <option value="amount-asc">Jumlah ↓</option>
              <option value="cat-asc">Kategori A–Z</option>
              <option value="cat-desc">Kategori Z–A</option>
            </select>
          </div>
        </div>
        <div class="transaction-list" id="transaction-list">
          <!-- Items rendered by JS -->
        </div>
      </div>

      <!-- Chart -->
      <div class="card">
        <div class="chart-title">📊 Pengeluaran per Kategori</div>
        <div class="chart-no-data" id="chart-no-data">Belum ada data untuk ditampilkan.</div>
        <div class="chart-wrapper" id="chart-wrapper" style="display:none">
          <canvas id="spending-chart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
